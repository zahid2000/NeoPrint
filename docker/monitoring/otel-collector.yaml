# OpenTelemetry Collector (plan step 8 "Monitorinq", T-477, T-479).
#
# The API pushes its metrics and traces here over OTLP/HTTP. Prometheus
# scrapes the metrics from the Prometheus exporter; the traces go on to
# Tempo. Nothing is sent outside the stack.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuses data before the container's own limit is reached (mem_limit in
  # docker-compose.yml), instead of being killed by it.
  memory_limiter:
    check_interval: 5s
    limit_mib: 100
    spike_limit_mib: 25
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name and service.instance.id arrive as exported_job and
    # exported_instance, which is what the dashboards use to tell API
    # instances apart; the rest of the resource is in target_info.
    # A series not updated for this long is dropped (a restarted API gets a
    # new instance id).
    metric_expiration: 10m

  # The traces, to Tempo inside the stack.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
