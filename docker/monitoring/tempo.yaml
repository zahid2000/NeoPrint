# Grafana Tempo (AGPL-3.0, run unmodified as a server - plan section 2.0):
# where the traces are kept (T-479). One process, local disk, seven days.
# The collector forwards the API's traces over OTLP; Grafana reads them
# (the "Tempo" data source). Nothing outside the stack reaches it.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # A trace is for finding out what happened to a request, not a record.
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
