# Prometheus (plan step 8 "Monitorinq", T-477). Retention is set on the
# command line in docker-compose.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The API's metrics, as the collector exposes them.
  - job_name: neoprint-api
    static_configs:
      - targets: ["otel-collector:8889"]

  # RabbitMQ's own plugin (rabbitmq_prometheus, on in the image): node
  # totals, and the queues one by one - the dead-letter queues among them.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
