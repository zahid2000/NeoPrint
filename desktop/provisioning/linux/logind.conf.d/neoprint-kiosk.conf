# NeoPrint kiosk (plan section 7.12). Installed by provision.sh into
# /etc/systemd/logind.conf.d/ and kept here so the repository records every
# change the script makes.
[Login]
NAutoVTs=0
ReserveVT=0
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
# No suspend after idle time (T-449); the kiosk sleeps only at night, by itself (T-448).
IdleAction=ignore
