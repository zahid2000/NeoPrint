# ---------------------------------------------------------------------------
# NeoPrint — development environment (plan section 4).
#
#   cp .env.openbao-seed.example .env.openbao-seed
#   docker compose up
#
# Every image tag is pinned. No secret is written into this file: the
# infrastructure containers take their development credentials from
# .env.openbao-seed, and the api container receives only its OpenBao
# connection details (plan section 2.13).
# ---------------------------------------------------------------------------

name: neoprint

services:

  # -------------------------------------------------------------------------
  # Secret store
  # -------------------------------------------------------------------------
  openbao:
    image: openbao/openbao:2.6.2
    container_name: neoprint-openbao
    # The image's entrypoint already points at /openbao/config; naming the file
    # again would load the same configuration twice.
    command: ["server"]
    cap_add:
      - IPC_LOCK
    environment:
      # The bao CLI defaults to HTTPS. TLS is disabled on this development
      # listener, so the in-container CLI (the health check below) is told to
      # use plain HTTP.
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./openbao/config:/openbao/config:ro
      - openbao-file:/openbao/file
      - openbao-logs:/openbao/logs
    healthcheck:
      # `bao status` exits non-zero while OpenBao is uninitialised or sealed,
      # which are both normal states before openbao-init has run. Printing the
      # status at all is enough to prove the server answers.
      test: ["CMD-SHELL", "bao status 2>&1 | grep -q 'Initialized' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Initialises, unseals and seeds OpenBao, then exits. See openbao/init/init.sh.
  openbao-init:
    image: openbao/openbao:2.6.2
    container_name: neoprint-openbao-init
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_KV_MOUNT: neoprint
    entrypoint: ["/bin/sh", "/openbao-init/init.sh"]
    volumes:
      - ./openbao/init:/openbao-init:ro
      - ./openbao/policies:/openbao-policies:ro
      - ./.env.openbao-seed:/openbao-seed/.env.openbao-seed:ro
      # The reference the seed file is checked against (openbao/init/init.sh).
      - ./.env.openbao-seed.example:/openbao-seed/.env.openbao-seed.example:ro
      - ./.openbao:/openbao-out
      - openbao-logs:/openbao/logs
    restart: "no"

  # -------------------------------------------------------------------------
  # Data stores
  # -------------------------------------------------------------------------
  mongo:
    image: mongo:7.0.43
    container_name: neoprint-mongo
    # Single-node replica set: transactions are mandatory for the MassTransit
    # outbox and the wallet updates (plan section 4).
    entrypoint: ["/bin/bash", "/docker/entrypoint.sh"]
    command:
      - "mongod"
      - "--replSet"
      - "rs0"
      - "--bind_ip_all"
      - "--keyFile"
      - "/data/configdb/replica.key"
    env_file:
      - .env.openbao-seed
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongo/entrypoint.sh:/docker/entrypoint.sh:ro
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  mongo-init:
    image: mongo:7.0.43
    container_name: neoprint-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.openbao-seed
    environment:
      MONGO_HOST: mongo:27017
      MONGO_REPLICA_SET: rs0
    entrypoint: ["/bin/bash", "/docker/init-replica.sh"]
    volumes:
      - ./docker/mongo/init-replica.sh:/docker/init-replica.sh:ro
    restart: "no"

  redis:
    # 7.2 is the last BSD-licensed line (plan section 2.0).
    image: redis:7.2.16-alpine
    container_name: neoprint-redis
    # $$ escapes compose interpolation so the container shell expands it.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --save 60 1"]
    env_file:
      - .env.openbao-seed
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: neoprint-rabbitmq
    env_file:
      - .env.openbao-seed
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Object storage - RustFS (Apache-2.0), plan section 2.10.
  #
  # rustfs is the primary; rustfs-secondary is the second provider the storage
  # sync wizard needs to show a migration or a mirror (plan section 9.8).
  #
  # The application only speaks S3 to it, so any S3-compatible store can take
  # its place (docs/DECISIONS.md: why RustFS, and not MinIO or Zenko).
  #
  # The image runs as a non-root user (UID/GID 10001). The data directories are
  # named volumes, which Docker creates owned by that user from the image, so
  # no permissions have to be fixed by hand. A host directory bind-mounted
  # instead has to be owned by 10001 first (docs/DEV_ENVIRONMENT.md).
  #
  # The image is pinned by digest as well as by tag, so a retagged image cannot
  # change what runs.
  # -------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: neoprint-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      # Logs to stdout, where docker compose logs finds them, rather than to a
      # directory inside the container.
      RUSTFS_OBS_LOG_DIRECTORY: ""
      # The web console, for looking at buckets in development. What it shows
      # is ciphertext: objects are encrypted before they are written.
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    # RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY, read by the image.
    env_file:
      - .env.openbao-seed
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # Unauthenticated; "ready" also covers the disks, not just the process.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  rustfs-secondary:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: neoprint-rustfs-secondary
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_CONSOLE_ENABLE: "false"
    env_file:
      - .env.openbao-seed
    ports:
      - "9010:9000"
    volumes:
      - rustfs-secondary-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  # Creates the buckets on both stores, then exits. Same image: it ships curl,
  # which signs S3 requests itself (--aws-sigv4), so there is no second image
  # to keep pullable.
  rustfs-init:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: neoprint-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-secondary:
        condition: service_healthy
    env_file:
      - .env.openbao-seed
    environment:
      RUSTFS_ENDPOINTS: http://rustfs:9000,http://rustfs-secondary:9000
    entrypoint: ["sh", "/docker/init-buckets.sh"]
    volumes:
      - ./docker/rustfs/init-buckets.sh:/docker/init-buckets.sh:ro
    restart: "no"

  # -------------------------------------------------------------------------
  # Mail catcher
  # -------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: neoprint-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Application
  # -------------------------------------------------------------------------
  api:
    build:
      # The repository root: the build needs global.json and the central
      # MSBuild property files as well as backend/.
      context: .
      dockerfile: backend/Dockerfile
    container_name: neoprint-api
    depends_on:
      openbao-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    # Bootstrap only. Every secret comes from OpenBao (plan section 2.13):
    # nothing below is a secret, and no NEOPRINT_* variable is set here.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      BAO_ADDR: http://openbao:8200
      BAO_KV_MOUNT: neoprint
      BAO_ROLE_ID_FILE: /run/secrets/neoprint-api.role_id
      BAO_SECRET_ID_FILE: /run/secrets/neoprint-api.secret_id
      # Documents are converted in the converter container, never in here
      # (docs/adr/ADR-0005-isolated-converter.md).
      Conversion__Mode: Isolated
      Conversion__WorkRoot: /spool
    ports:
      - "5080:8080"
    volumes:
      - conversion-spool:/spool
      # Written by openbao-init; mounted read-only, like a Docker secret.
      # The directory is mounted rather than the two files: openbao-init
      # replaces them on every run, and a single-file bind mount would then
      # point at a deleted inode. Only creds/ is mounted, so the container
      # never sees the unseal key and root token in .openbao/init.json.
      - ./.openbao/creds:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Document conversion, isolated (plan section 10, CLAUDE.md "İstifadəçi
  # faylları untrusted input", docs/adr/ADR-0005-isolated-converter.md).
  # The API image, started as the spool worker: LibreOffice, Ghostscript and
  # the converter tool (PDFium, SkiaSharp, PDFsharp - page counts, previews,
  # image and page edits, layouts) run here, with no network at all, a
  # read-only root, no capabilities, no secrets, and CPU / memory / process
  # count capped by the cgroup (prlimit caps each job again inside). The API
  # process itself parses no user file. The only thing the two share is the
  # spool, a tmpfs volume, so no document is ever written to disk.
  converter:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neoprint-converter
    command: ["--converter-worker", "/spool"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      HOME: /tmp
    volumes:
      - conversion-spool:/spool
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      # The worker touches this file every five seconds.
      test: ["CMD-SHELL", "find /spool/.converter-alive -newermt '-30 seconds' | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    restart: unless-stopped

  # The panel and the API behind one origin: nginx proxies /api and /hubs to
  # the backend, so the SameSite=Strict refresh cookie works and no CORS
  # configuration is needed (plan section 8A.1).
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: neoprint-admin
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  # The conversion spool: in memory only, owned by the API's and the
  # converter's user (2000), shared by those two containers alone.
  conversion-spool:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=2g,uid=2000,gid=2000,mode=0700"
  openbao-file:
  openbao-logs:
  mongo-data:
  mongo-config:
  redis-data:
  rabbitmq-data:
  rustfs-data:
  rustfs-secondary-data:
