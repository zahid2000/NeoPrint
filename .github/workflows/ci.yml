# NeoPrint CI (plan section 12, step 1).
#
# Five jobs, one per thing that can break on its own: the backend, the kiosk on
# both of its platforms, the mobile app, the admin panel, and the licence
# policy. They are independent, so a red backend still tells us whether the
# panel builds.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # --------------------------------------------------------------------
  # Backend
  # --------------------------------------------------------------------
  backend:
    name: backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The SDK version comes from global.json, so CI and a developer machine
      # cannot drift apart.
      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-backend-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'backend/**/*.csproj') }}
          restore-keys: nuget-backend-${{ runner.os }}-

      # The same release backend/Dockerfile copies into the image. Without it
      # the conversion tests skip, and the page count and preview rendering -
      # which every price depends on - would go unexercised until production.
      - name: Install the PDFium native library
        run: |
          release=chromium/8066
          curl -fsSL -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${release}/pdfium-linux-x64.tgz"
          # Checked before it is unpacked, as in backend/Dockerfile (T-100).
          echo "0b43f405477cf2cfc4dbff06905093c3309756c6bca1fb9da99234a2ca97fed2  /tmp/pdfium.tgz" | sha256sum -c -
          sudo mkdir -p /usr/local/lib
          sudo tar -xzf /tmp/pdfium.tgz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/local/lib/libpdfium.so
          sudo ldconfig
          test -f /usr/local/lib/libpdfium.so

      - name: Restore
        run: dotnet restore backend/NeoPrint.sln

      - name: Build
        run: dotnet build backend/NeoPrint.sln --configuration Release --no-restore

      # The runner has a Docker daemon, so the container-backed integration
      # tests (Mongo, Redis) really run here rather than skipping as they may
      # on a developer machine.
      - name: Test
        run: >-
          dotnet test backend/NeoPrint.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=backend.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore

  # --------------------------------------------------------------------
  # Kiosk (desktop)
  # --------------------------------------------------------------------
  #
  # One build per platform the kiosk ships on. The build is universal - nothing
  # kiosk-specific is baked in (plan section 7.11) - but the platform
  # implementations differ, so both legs have to compile and both have to pass
  # the tests.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-desktop-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'desktop/**/*.csproj') }}
          restore-keys: nuget-desktop-${{ runner.os }}-

      # The Windows platform project targets net8.0-windows. Compiling that TFM
      # on Linux needs the reference assemblies, which this property pulls in;
      # it changes nothing on the Windows leg.
      - name: Restore
        run: dotnet restore desktop/NeoPrint.Kiosk.sln -p:EnableWindowsTargeting=true

      - name: Build
        run: >-
          dotnet build desktop/NeoPrint.Kiosk.sln
          --configuration Release
          --no-restore
          -p:EnableWindowsTargeting=true

      - name: Test
        run: >-
          dotnet test desktop/NeoPrint.Kiosk.sln
          --configuration Release
          --no-build
          -p:EnableWindowsTargeting=true
          --logger "trx;LogFileName=desktop.trx"
          --results-directory artifacts/test-results
        # ScreenRenderTests draws every kiosk screen in three languages; the
        # pictures go out with the test results.
        env:
          NEOPRINT_SCREENS_DIR: ${{ github.workspace }}/artifacts/test-results/kiosk-screens

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # --------------------------------------------------------------------
  # Mobile
  # --------------------------------------------------------------------
  mobile:
    name: mobile (analyze + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Cloned from the official repository rather than through a third-party
      # action, so CI adds no dependency that would need justifying under the
      # plan's library policy. The version is printed into the log so a failure
      # can be tied to an SDK release.
      - name: Install the Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TOOL_CACHE/flutter"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Record the SDK version
        run: flutter --version

      - name: Cache the pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Resolve packages
        run: flutter pub get
        working-directory: mobile

      # analysis_options.yaml carries the lint rules, so this is the mobile
      # equivalent of the lint step.
      - name: Analyze
        run: flutter analyze
        working-directory: mobile

      # The whole tree is dart format clean as of the step 1 follow-up, so
      # unformatted code is a build failure rather than a growing backlog.
      - name: Check formatting
        run: dart format --set-exit-if-changed .
        working-directory: mobile

      - name: Test
        run: flutter test
        working-directory: mobile

      # The Android build compiles the Kotlin platform code (the HEIC channel)
      # and the plugins, which analyze and test never touch. The runner image
      # carries the Android SDK; Java 17 is what the Gradle plugin needs.
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android (debug)
        run: flutter build apk --debug
        working-directory: mobile

      - name: Build web
        run: flutter build web
        working-directory: mobile

  # --------------------------------------------------------------------
  # Admin panel
  # --------------------------------------------------------------------
  admin:
    name: admin (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      # npm ci, not npm install: the lock file is what was reviewed.
      - name: Install dependencies
        run: npm ci
        working-directory: admin

      - name: Lint
        run: npm run lint
        working-directory: admin

      # An icon outside the self-hosted Material Symbols subset renders as
      # its name in plain text (docs/DECISIONS.md).
      - name: Icon subset
        run: node scripts/icon-subset.mjs --check
        working-directory: admin

      # A key with no translation is shown as the key itself and fails nothing
      # else: every key written in a template, and every value the server
      # sends that a key is built from (an enum member, a setting, a feature
      # flag), must be in the dictionaries.
      - name: Translation keys
        run: node scripts/i18n-check.mjs
        working-directory: admin

      # The tests run in jsdom, so no browser is needed on the runner.
      - name: Test
        run: npx ng test --watch=false
        working-directory: admin

      - name: Build
        run: npx ng build --configuration production
        working-directory: admin

      # The built panel in the runner's own Chrome, every page in az, en and
      # ru, the API played back from a recording: no raw translation key, a
      # heading, no "could not load" banner, no sideways scroll - and a
      # picture of each page.
      - name: Rendered pages
        run: node --test e2e/render.test.mjs
        working-directory: admin

      - name: Upload page pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-pages
          path: admin/e2e/screenshots
          if-no-files-found: ignore

  # --------------------------------------------------------------------
  # Design rules
  # --------------------------------------------------------------------
  #
  # No hardcoded colour, font size or spacing in the admin panel, the mobile
  # app or the kiosk (CLAUDE.md, docs/DESIGN_SYSTEM.md): every such value is a
  # token, so a redesign is a change to the token files alone.
  design-lint:
    name: design rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the checker
        run: npm test
        working-directory: tools/design-lint

      - name: Check the UIs
        run: node tools/design-lint

  # --------------------------------------------------------------------
  # Licence policy
  # --------------------------------------------------------------------
  #
  # Every ecosystem is restored first and the check runs with --strict, so an
  # ecosystem that could not be scanned fails the job instead of passing
  # quietly on an empty dependency list.
  license-check:
    name: licence policy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install the Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TOOL_CACHE/flutter"
          echo "$RUNNER_TOOL_CACHE/flutter/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TOOL_CACHE/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Cache the pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Restore the .NET solutions
        run: |
          dotnet restore backend/NeoPrint.sln
          dotnet restore desktop/NeoPrint.Kiosk.sln -p:EnableWindowsTargeting=true

      - name: Restore the admin panel
        run: npm ci
        working-directory: admin

      - name: Resolve the mobile packages
        run: flutter pub get
        working-directory: mobile

      # The checker has no dependencies of its own, so its own tests are just
      # node --test.
      - name: Test the checker
        run: npm test
        working-directory: tools/license-check

      - name: Check licences
        run: node tools/license-check --strict
