name: neoprint
description: NeoPrint — çoxfunksiyalı terminal (kiosk) printer platformasının mobil tətbiqi.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.13.0

# Only packages from the approved list in plan section 2.0, all pinned.
# Every one is recorded in docs/THIRD_PARTY.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (MIT).
  flutter_riverpod: 2.6.1

  # Navigation, including the deep links from plan section 8.3 (BSD-3, Flutter team).
  go_router: 14.6.2

  # HTTP, with the token interceptor and refresh (MIT).
  dio: 5.7.0

  # Our own SignalR client rides on this rather than taking a SignalR package
  # (plan section 2.0).
  web_socket_channel: 3.0.1

  # Dates, numbers and money formatting (BSD-3, Dart team).
  intl: 0.20.3

  # Choosing a file to upload (MIT).
  file_picker: 13.1.0

  # Taking a photo to upload (BSD-3, Flutter team).
  camera: 0.12.1

  # Reading the kiosk's payment QR from the camera stream, on the phone
  # itself (MIT; plan section 2.0). Android and iOS only - the web build
  # opens the same payment from the neoprint://pay link instead.
  google_mlkit_barcode_scanning: 0.16.1

  # The kiosks map: OpenFreeMap vector tiles drawn by MapLibre Native
  # (BSD-3; approved 2026-10-18, T-286). No key, no fee; the style comes
  # from the server's settings.
  maplibre_gl: 0.27.1

  # Where the user is, for "near me" (MIT; plan section 2.0).
  geolocator: 14.1.1

  # Push (BSD-3, Google's official FlutterFire; plan section 2.0). The
  # backend sends through its own FCM HTTP v1 client; the app only receives.
  # On the web firebase_core_web loads the Firebase JS SDK 12.19.0 from
  # gstatic.com, and web/firebase-messaging-sw.js pins the same version.
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0

  # A scan's pages after the scanner: crop, turn, filter, brightness, and the
  # JPEG at 300 dpi for the real size (MIT; plan sections 2.0, 2.11). Pure
  # Dart, run off the UI thread.
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true

  # Localization is generated from lib/l10n; az is the template and the
  # default (plan section 2.1).
  generate: true

  # Inter, the family the design system names (docs/DESIGN_SYSTEM.md section
  # 2). Bundled rather than fetched, so the application looks the same on
  # every device and needs no network to render text. One variable file
  # declared at three weights: the asset is bundled once, and the loader
  # applies the wght axis. Licence: SIL OFL 1.1, assets/fonts/OFL.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
