# Sent with every answer of the panel's own (T-217). In its own file because
# nginx drops the server's add_header lines in a location that has one of its
# own - the HTML document went out without them before.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
