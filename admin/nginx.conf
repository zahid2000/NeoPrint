# The admin panel, and the API behind the same origin (plan section 8A.1).

# Access log lines without the query string. The SignalR client puts the access
# token in the URL (?access_token=) on WebSocket and EventSource requests, since
# a browser cannot send a header there, and the stock format logged it: tokens
# never go into a log (docs/OBSERVABILITY.md). $uri is the path alone.
log_format neoprint '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log neoprint;

    # The API is looked up by name on every request, through Docker's embedded
    # DNS, rather than once at start-up: a recreated api container comes back
    # on a new address, and a name resolved once would keep sending the panel
    # to the old one (502) until this container restarted (T-166). A variable
    # in proxy_pass is what makes nginx resolve at run time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    root /usr/share/nginx/html;
    index index.html;

    # The panel is a single-page application served from one origin; nothing
    # here should be framed, sniffed or sent to another site as a referrer.
    # Repeated in every location below that sets a header of its own.
    include /etc/nginx/snippets/security-headers.conf;

    # For the container healthcheck: answered without touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker and what it reads to learn of a new build keep their
    # names from build to build, so they must never be kept by the browser - a
    # year-old worker would pin the panel to a year-old build. Exact matches,
    # which nginx prefers to the pattern below.
    location = /ngsw-worker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location = /ngsw.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location = /safety-worker.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is what points at the hashed files, so it must not be cached.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
        add_header Cache-Control "no-store";
    }

    # ^~: a prefix match that wins over the regex above - without it
    # /api/users/me/qr.png and /api/files/{id}/pages/1.png were looked for as
    # static files and answered 404 (T-343, T-344).
    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limits and the audit log record the caller's address, so the
        # backend must see the real one rather than the proxy's.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A file upload can be large; the backend enforces its own limit
        # (Files.MaxFileSizeMb), so nginx should not refuse first.
        client_max_body_size 256m;
        proxy_request_buffering off;
    }

    # SignalR: long-lived connections that must not be buffered or timed out.
    location ^~ /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # The Office editor (T-459): Collabora Online, behind this same origin, so
    # the app and the kiosk load it from the API's address and nothing about
    # its host or scheme is configured twice. Only what the editor page needs
    # is passed: its static files, the document's WebSocket and the
    # clipboard. Discovery is read by the API inside the stack; convert-to,
    # the admin console and the rest are never reachable from outside -
    # through this proxy every caller would look like a trusted private
    # address to Collabora. Resolved per request: on a server without the
    # "office" profile the name does not exist, and nginx must still start.
    # One header of their own, so the panel's X-Frame-Options DENY is not
    # inherited: Collabora sets its own frame rules for its page.
    location ^~ /browser/ {
        set $collabora_upstream http://collabora:9980;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/cool/.+/ws$ {
        set $collabora_upstream http://collabora:9980;
        proxy_pass $collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /cool/clipboard {
        set $collabora_upstream http://collabora:9980;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass $collabora_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 32m;
    }

    # A plain prefix, not ^~: the WebSocket regex above must still win for its paths.
    location /cool/ {
        return 404;
    }

    location ^~ /hosting/ {
        return 404;
    }

    # Every other path is a route inside the panel.
    # The map's worker (T-217) is an ES module: served from here, as JavaScript,
    # with the page's policy - the worker fetches the map's tiles under it.
    location /maplibre/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
        types { text/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
