# The admin panel, and the API behind the same origin (plan section 8A.1).

# Access log lines without the query string. The SignalR client puts the access
# token in the URL (?access_token=) on WebSocket and EventSource requests, since
# a browser cannot send a header there, and the stock format logged it: tokens
# never go into a log (docs/OBSERVABILITY.md). $uri is the path alone.
log_format neoprint '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log neoprint;

    # The API is looked up by name on every request, through Docker's embedded
    # DNS, rather than once at start-up: a recreated api container comes back
    # on a new address, and a name resolved once would keep sending the panel
    # to the old one (502) until this container restarted (T-166). A variable
    # in proxy_pass is what makes nginx resolve at run time.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    root /usr/share/nginx/html;
    index index.html;

    # The panel is a single-page application served from one origin; nothing
    # here should be framed, sniffed or sent to another site as a referrer.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # For the container healthcheck: answered without touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The service worker and what it reads to learn of a new build keep their
    # names from build to build, so they must never be kept by the browser - a
    # year-old worker would pin the panel to a year-old build. Exact matches,
    # which nginx prefers to the pattern below.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-store";
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is what points at the hashed files, so it must not be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limits and the audit log record the caller's address, so the
        # backend must see the real one rather than the proxy's.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A file upload can be large; the backend enforces its own limit
        # (Files.MaxFileSizeMb), so nginx should not refuse first.
        client_max_body_size 256m;
        proxy_request_buffering off;
    }

    # SignalR: long-lived connections that must not be buffered or timed out.
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Every other path is a route inside the panel.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
